# "generic" Churro kernel: stock GKI config + what most non-Googlebook PCs need.
# Built-in: firmware framebuffer display (simpledrm on the UEFI GOP framebuffer) so every
# machine gets a screen even without a GPU driver; real GPU drivers replace it when they load.
Y="SYSFB SYSFB_SIMPLEFB DRM_SIMPLEDRM VT VT_CONSOLE FB FRAMEBUFFER_CONSOLE DRM_FBDEV_EMULATION WLAN_VENDOR_ATH"
# VT/fbcon: kernel + init messages on the screen ("debug console" GRUB entry, console=tty0), the
# only log a serial-less laptop has. SurfaceFlinger takes the display over when it starts.
# Modules (loaded from the Churro ramdisk): older Intel GPUs (Gen4-Gen11, e.g. Broadwell HD 5300),
# SATA/AHCI disks, virtio GPU/input for VMs.
M="DRM_I915 ATA SATA_AHCI DRM_VIRTIO_GPU VIRTIO_INPUT DRM_VGEM MMC_SDHCI_ACPI MMC_SDHCI_PCI CFG80211 MAC80211 ATH9K DRM_NOUVEAU VMD"
# VMD: Intel Volume Management Device ("RST"/VMD mode, default on many 11th-gen+ laptops): the
# NVMe/SATA disks behind it are invisible without it. Safe only with firmware-lockdown's fstab
# edit (no vold wildcards for internal disks).
# DRM_NOUVEAU: NVIDIA GPUs (GSP firmware on Turing+). Not a ramdisk pack: it needs firmware, so
# drivers-extra adds it to vendor_dlkm (ueventd loads it by PCI alias), linked against the
# image's own drm helper modules.
# DRM_VGEM: render node for software rendering (Mesa kms_swrast + minigbm "vgem" backend) on
# machines whose GPU has no driver; MMC_SDHCI_ACPI/PCI: eMMC on Atom/Core M tablets (needed in the
# ramdisk to boot from eMMC: the vendor's sdhci-pci lives on vendor_dlkm, too late).
# CFG80211/MAC80211/ATH9K: in-tree Wi-Fi stack for the opt-in "wifi" pack (the image's own
# cfg80211/mac80211 are out-of-tree builds that only Intel iwlwifi uses).
N=""
# Distro-like driver coverage: every option a broad distro kernel (Arch Linux, pinned config)
# builds as a module, if its Kconfig lives in a consumer-PC driver directory (DISTRO_DIRS) and it
# isn't denied below. Only modules are added: an option that is built-in in the GKI config stays
# as it is, and prepare.sh's kABI check fails the build if any GKI export changed anyway.
# Modules end up in vendor_dlkm (feature drivers-extra), loaded by ueventd by device alias.
# Updating (new distro config, build failures and what they mean): docs/03, "Updating the driver
# set and firmware".
DISTRO_CONFIG=https://gitlab.archlinux.org/archlinux/packaging/packages/linux/-/raw/$ARCH_LINUX_CONFIG_TAG/config   # versions.env
DISTRO_DIRS='^drivers/(net/ethernet|net/usb|net/wireless|net/phy|net/mdio|net/pcs|bluetooth|input|hid|i2c|gpio|pinctrl|platform/x86|platform/surface|mmc|memstick|usb|thunderbolt|gpu/drm|sound|thermal|hwmon|iio|leds|power|rtc|misc|acpi|mfd|regulator|extcon|media/usb|media/i2c|media/pci/intel|media/common|media/v4l2-core|media/mc|staging/media/ipu|nfc|ptp|dma|spi|pwm|soundwire|ata|nvme|char/hw_random|cpufreq|idle|tty/serial)/|^sound/'
# Denied: Google ships its own (xe; i915 = opt-in pack), safety (TPM, SPI flash, NPU), options
# whose built-in side effects change GKI structs (DPLL, NET_SHAPER, NET_HANDSHAKE users: server
# NICs, NVMe-over-TCP), datacenter NICs (huge firmware, no laptop/desktop has them) and
# debug/test options.
DISTRO_DENY='^(DRM_I915.*|DRM_XE.*|KVM.*|TRUSTED_KEYS|ENCRYPTED_KEYS|RPMB|TCG_.*|TPM.*|SPI_INTEL.*|INTEL_VPU|DRM_ACCEL.*|MTD.*|NETCONSOLE.*|ICE|MLX5_DPLL|PTP_1588_CLOCK_OCP|PTP_1588_CLOCK_VMW|IAVF|MICROSOFT_MANA|NVME_TCP|NVME_TARGET.*|NFP.*|MLX4.*|MLX5.*|MLXSW.*|MLXFW|MLXBF.*|QED.*|BNX2X.*|BNXT.*|CHELSIO.*|CXGB.*|LIQUIDIO.*|SFC.*|HINIC.*|OCTEON.*|IONIC|FUN_.*|ENA_ETHERNET|GVE|IDPF|.*_DEBUG.*|.*_TEST.*|.*KUNIT.*)$'
